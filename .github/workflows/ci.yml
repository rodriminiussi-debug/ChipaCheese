name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chipa
          POSTGRES_PASSWORD: chipa
          POSTGRES_DB: chipa_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U chipa" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://chipa:chipa@localhost:5433/chipa_test
      TEST_DATABASE_URL: postgres://chipa:chipa@localhost:5433/chipa_test
      SESSION_SECRET: ci-secret-0123456789abcdef
      AI_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migraciones aplicables desde cero
        run: pnpm --filter @chipa/db migrate
      - name: Unit + integración
        run: pnpm test
      - name: Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm --filter web build
      - name: E2E (contra el build de producción)
        run: pnpm test:e2e
        env:
          E2E_PROD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
