name: Backup diario

# Requisito no funcional: "backup automático diario en la nube".
# Complementa el backup del proveedor (Supabase). Requiere el secret PROD_DATABASE_URL (conexión directa, puerto 5432).
on:
  schedule:
    - cron: "0 6 * * *" # 03:00 Argentina
  workflow_dispatch:

jobs:
  pg_dump:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    steps:
      - name: Instalar cliente de Postgres 16
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          FILE="chipa-$(date -u +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/16/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" -f "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
